global:
   arguments: 
     aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: eval-ed
   infrastructure:
     cloud: aws
     product: ec2
     area: server
selectors:
   network_vars:
     labels:
       environment: dev
       purpose: eval-ed
       area: network
       region: eu-west-1
       cloud: aws
infrastructure:
   rds:
       stack_name: elasticdev:::aws_ec2_server
       arguments:
          sg_id: selector:::network_vars::web_sg_id
          subnet_ids: selector:::network_vars::public_subnet_ids
          hostname: test-demo
          cloud_tags_hash:
            environment: dev
            purpose: eval-ed
       to_base64:
         - cloud_tags_hash
       labels:
         - general
         - infrastructure
       selectors:
         - network_vars
       credentials:
         - reference: eval-ed-iam
           orchestration: true
