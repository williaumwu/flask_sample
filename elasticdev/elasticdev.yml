labels:
   general: 
     environment: eval
     purpose: test
   infrastructure:
     cloud: aws
     product: rds
     app_tier: database
selectors:
   network_vars:
     labels:
       environment: eval
       purpose: test
       area: networking
       cloud: aws
infrastructure:
   rds:
       stack_name: elasticdev:::aws_rds
       arguments:
          vpc_name: selector:::network_vars::vpc_name
          sg_id: selector:::network_vars::db_sg_id
          subnet_ids: selector:::network_vars::private_subnet_ids:csv
          cloud_tags_hash:
              environment: eval
              purpose: test
          aws_default_region: eu-west-1
          rds_name: eval-ed-rds
          allocated_storage: 14
          db_name: app
          publish_creds: true
          publish_to_saas: true
       to_base64:
         - cloud_tags_hash
       labels:
         - general
         - infrastructure
       selectors:
         - network_vars
       credentials:
           - reference: eval-ed-iam
             orchestration: true
       inputvars:
           - reference: rds
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
