global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: aws
     product: mongodb
selectors:
   vpc_info:
     match_labels:
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
     match_params:
       must_exists: True
       resource_type: vpc
   public_subnet_info:
     match_labels:
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
       name: public
     match_params:
       resource_type: subnet
   sg_bastion_info:
     match_labels:
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
       name: bastion
     match_params:
       must_be_one: True
       resource_type: security_group
   instance_profile_info:
     match_labels:
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
     match_params:
       must_be_one: True
       resource_type: iam_instance_profile
infrastructure:
   ec2_admin:
       stack_name: elasticdev:::ec2_ubuntu_admin
       arguments:
          hostname: eval-ec2-admin
          spot: true
          vpc_name: selector:::vpc_info::name
          subnet_ids: selector:::public_subnet_info::subnet_id:csv
          sg_id: selector:::sg_bastion_info::sg_id
          vpc_id: selector:::vpc_info::vpc_id
          instance_profile_name: selector:::instance_profile_info::name
          ip_key: public_ip
          size: t3.micro
          disksize: 25
          ssh_key_name: eval-ed-admin-ssh-key
       selectors:
         - vpc_info
         - public_subnet_info
         - sg_bastion_info
         - instance_profile_info
       credentials:
         - reference: eval-ed-iam
           orchestration: true
