global:
   arguments: 
     aws_default_region: eu-west-1
     cloud_tags_hash:
       environment: dev
       purpose: eval-ed
       product: eks
labels:
   general: 
     environment: dev
     purpose: eval-ed
   infrastructure:
     cloud: aws
     product: eks
selectors:
   network_vars:
     labels:
       environment: dev
       purpose: eval-ed
       area: network
       region: eu-west-1
       cloud: aws
infrastructure:
   eks-workshop:
       stack_name: elasticdev:::eks_workshop
       arguments:
          vpc_name: selector:::network_vars::vpc_name
          vpc_id: selector:::network_vars::vpc_id
          sg_id: selector:::network_vars::bastion_sg_id
          subnet_ids: selector:::network_vars::public_subnet_ids
          bastion_sg_id: selector:::network_vars::bastion_sg_id
          workshop_name: eks-workshop
          eks_min_capacity: 1
          eks_max_capacity: 1
          eks_desired_capacity: 1
          instance_type: t3.micro
          disksize: 25
       labels:
          - general
          - infrastructure
       selectors:
          - network_vars
       credentials:
          - reference: eval-ed-iam
            orchestration: true
       inputvars:
          - reference: eks-workshop-public-key
            orchestration: true
