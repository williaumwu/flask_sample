global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: aws
     product: cloud9
selectors:
   subnet_info:
     match_labels:
       car: bmw
       model: 320i
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
       name: public
     match_params:
       resource_type: subnet
infrastructure:
   cloud9:
       stack_name: elasticdev:::aws_cloud9
       arguments:
          subnet_ids: selector:::subnet_info::subnet_id:csv
          automatic_stop_time_minutes: 10
          cloud9_name: eval-ed-cloud9-admin
       labels:
          - general
          - infrastructure
       selectors:
         - subnet_info
       credentials:
           - reference: eval-ed-iam
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
