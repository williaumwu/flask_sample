global:
  arguments: 
    aws_default_region: eu-west-1
  metadata:   
    labels:
       general: 
         environment: dev
         purpose: eval-ed
       infrastructure:
         cloud: aws
         product: ec2
         area: server
    matchSelectors:
       network_vars:
         labels:
           environment: dev
           purpose: eval-ed
           area: network
           region: eu-west-1
           cloud: aws
infrastructure:
  ec2:
    stack_name: elasticdev:::aws_ec2_server
    arguments:
       key_name: default
       hostname: server101
       sg_id: selector:::network_vars::web_sg_id
       subnet_ids: selector:::network_vars::public_subnet_ids
       remote_stateful: s3://app-env.customer-provider.tfstatefile
       cloud_tags_hash:
         environment: dev
         purpose: eval-ed
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
    metadata:   
      labels:
        - general
        - infrastructure
      matchSelectors:
        - network_vars
      credentials:
        - reference: eval-ed-iam
          orchestration: true
