global:
  arguments: 
    aws_default_region: eu-west-1
    ci_environment: ed-eval
    suffix_id: d645633
    cloud_tags_hash:
        environment: dev
        purpose: ci
        billing_code: 87deo
  metadata:   
    labels:
       general: 
         environment: dev
         purpose: ci
infrastructure:
   ecr_repo:
     stack_name: elasticdev:::ecr_repo
     arguments:
        name: flask_sample
        docker_repo: flask_sample
     metadata:
       credentials:
         - reference: eval-ed-iam
           orchestration: true
custom:
   codebuild:
     stack_name: elasticdev:::add_codebuild_ci
     arguments:
       codebuild_name: flask-sample-private
       git_repo: flask_sample-private
       git_url: git@github.com:williaumwu/flask_sample-private.git
       branch: ci
       ecr_repo_name: flask_sample
       docker_username: williaumwu
       docker_registry: ecr
       slack_channel: testing
     spec:
       dependencies: 
         - infrastructure::ecr_repo
       serialization:
         to_base64:
           arguments:
             - cloud_tags_hash
     metadata:
       credentials:
         - reference: eval-ed-iam
           orchestration: true
       inputvars:
         - reference: dockerhub-token
           orchestration: true
         - reference: slack-webhook
           orchestration: true
         - reference: github-token
           orchestration: true
       labels:
          - general
