global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: aws
   iam-instance-profile:
     product: iam-instance-profile
   eks:
     product: eks
selectors:
   vpc_info:
     match_labels:
       car: bmw
       model: 320i
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
     match_params:
       must_exists: True
       resource_type: vpc
   sg_bastion_info:
     match_labels:
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
       name: bastion
     match_params:
       must_be_one: True
       resource_type: security_group
   subnet_info:
     match_labels:
       car: bmw
       model: 320i
       environment: dev
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
       name: public
     match_params:
       resource_type: subnet
infrastructure:
   iam-role:
       stack_name: elasticdev:::aws_iam_role
       arguments:
          role_name: eks-workshop-role
          iam_instance_profile: eks-workshop-role
          iam_role_policy_name: eks-workshop-role
       labels:
          - general
          - infrastructure
          - iam-instance-profile
       credentials:
           - reference: aws
             orchestration: true
   eks:
       dependencies: 
           - infrastructure::iam-role
       stack_name: elasticdev:::aws_eks
       arguments:
          role_name: eks-workshop-role
          vpc_name: selector:::vpc_info::name
          vpc_id: selector:::vpc_info::vpc_id
          eks_cluster: eks-workshop
          eks_cluster_version: 1.19
          subnet_ids: selector:::subnet_info::subnet_id:csv
          sg_id: selector:::sg_bastion_info::sg_id
          eks_min_capacity: 1
          eks_max_capacity: 1
          eks_desired_capacity: 1
       labels:
          - general
          - infrastructure
          - eks
       selectors:
         - vpc_info
         - subnet_info
         - sg_bastion_info
       credentials:
           - reference: eval-ed-iam
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
