global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: ci
     provider: gitlab
   gitlab: 
     platform: gitlab
     component: runner
infrastructure:
   iam:
       stack_name: elasticdev:::aws_iam
       arguments:
          iam_name: gitlab-runner
          policy_name: gitlab-runner
          allows_hash: 
             - resources: 
                 - "*"
               actions: 
                 - s3:*
                 - ec2:*
       to_base64:
         - allows_hash
       labels:
          - general
          - gitlab
       credentials:
           - reference: aws
             orchestration: true
