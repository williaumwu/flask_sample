global:
   selectors: 
     aws:
       match_keys:
         provider: aws
   arguments: 
     aws_default_region: eu-west-1
     ci_environment: ed-eval
     suffix_id: d645633
     cloud_tags_hash:
       environment: dev
       purpose: ci
       billing_code: 87deo
       platform: gitlab
labels:
   general: 
     environment: dev
     purpose: ci
     provider: gitlab
   gitlab: 
     platform: gitlab
     component: runner
selectors:
   runner_token_info:
     match_params:
       must_exists: True
       resource_type: gitlab_runner
     keys:
       provider: gitlab
     labels:
       platform: gitlab
       component: runner
   aws_gitlab_cred:
     labels:
       platform: gitlab
       component: runner
     keys:
       provider: aws
       region: eu-west-1
     parameters:
       must_exists: True
       resource_type: credentials
   vpc_info:
     match_ref: aws
     match_params:
       must_exists: True
       resource_type: vpc
   public_subnet_info:
     match_ref: aws
     match_keys:
       name: public
     match_params:
       resource_type: subnet
   sg_bastion_info:
     match_ref: aws
     match_keys:
       name: bastion
     match_params:
       must_be_one: True
       resource_type: security_group
infrastructure:
   setup_gitlab:
       stack_name: elasticdev:::setup_gitlab_ci
       arguments:
          visibility_level: private
          gitlab_token: selector:::runner_token_info::runner_token
          gitlab_runner_aws_access_key: selector:::aws_gitlab_cred::AWS_ACCESS_KEY_ID
          gitlab_runner_aws_secret_key: selector:::aws_gitlab_cred::AWS_SECRET_ACCESS_KEY
          vpc_name: selector:::vpc_info::name
          subnet_ids: selector:::public_subnet_info::subnet_id:csv
          sg_id: selector:::sg_bastion_info::sg_id
          vpc_id: selector:::vpc_info::vpc_id
          bastion_sg_id: selector:::sg_bastion_info::sg_id
          instance_type: t3.micro
       to_base64:
         - cloud_tags_hash
       selectors:
         - vpc_info
         - public_subnet_info
         - sg_bastion_info
         - aws_gitlab_cred
         - runner_token_info
       credentials:
         - reference: eval-ed-iam
           orchestration: true
       inputvars:
           - reference: gitlab-parent-group
             orchestration: true
           - reference: gitlab-token
             orchestration: true
       labels:
           - general
           - gitlab
