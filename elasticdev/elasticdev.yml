labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: do
selectors:
   ssh_key_info:
     match_labels:
       cloud: do
       environment: dev
     match_keys:
       provider: do
     match_params:
       must_exists: True
       resource_type: ssh_key
infrastructure:
       stack_name: elasticdev:::jenkins_on_docker
       arguments:
          ssh_key_name: ed-test-do-key
          hostname: example-droplet
       labels:
         - general
         - infrastructure
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
