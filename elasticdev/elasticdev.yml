global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
   infrastructure:
     cloud: aws
selectors:
   vpc_info:
     match_labels:
       environment: eval
       purpose: test
     match_keys:
       provider: aws
       region: eu-west-1
     match_params:
       must_exists: True
       resource_type: vpc
   sg_bastion_info:
     match_labels:
       environment: eval
       purpose: test
     match_keys:
       provider: aws
       region: eu-west-1
       name: bastion
     match_params:
       must_be_one: True
       resource_type: security_group
   public_subnet_info:
     match_labels:
       environment: eval
       purpose: test
     match_keys:
       provider: aws
       region: eu-west-1
       name: public
     match_params:
       resource_type: subnet
infrastructure:
   docker-build:
       stack_name: elasticdev:::docker_build_2
       arguments:
          docker_host: docker-temp-build-034
          vpc_name: selector:::vpc_info::name
          vpc_id: selector:::vpc_info::vpc_id
          subnet_ids: selector:::public_subnet_info::subnet_id:csv
          sg_id: selector:::sg_bastion_info::sg_id
          bastion_sg_id: selector:::sg_bastion_info::sg_id
          instance_type: t3.micro
          docker_image_tag: latest
          docker_repo_name: flask_sample
          disksize: 25
       labels:
          - general
          - infrastructure
       selectors:
         - vpc_info
         - public_subnet_info
         - sg_bastion_info
       credentials:
           - reference: eval-ed-iam
             orchestration: true
       inputvars:
           - reference: aws_account_id
             orchestration: true

