global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: test
   iam:
     cloud: aws
     product: iam
   vpc:
     cloud: aws
     product: vpc
infrastructure:
   iam:
       stack_name: elasticdev:::aws_iam
       arguments:
          iam_name: demo-ed-iam
          policy_name: demo-ed-iam
          allows_hash: 
             - resources: 
                 - "*"
               actions: 
                 - rds:*
                 - kafka:*
                 - logs:*
                 - cloudtrail:*
                 - dynamodb:*
                 - sqs:*
                 - codebuild:*
                 - appmesh:*
                 - servicediscovery:*
                 - cloudfront:*
                 - kms:*
                 - kinesis:*
                 - xray:*
                 - events:*
                 - sns:*
                 - elasticfilesystem:*
                 - states:*
                 - apigateway:*
                 - s3:*
                 - cloudformation:*
                 - iam:*
                 - devicefarm:*
                 - glacier:*
                 - cloudwatch:*
                 - ssm:*
                 - aws-portal:*
                 - route53:*
                 - lambda:*
                 - ecs:*
                 - ecr:*
                 - codepipeline:*
                 - ec2:*
                 - eks:*
                 - acm:*
       to_base64:
         - allows_hash
       labels:
          - general
          - iam
       credentials:
           - reference: aws
             orchestration: true
   vpc:
       dependencies: 
           - infrastructure::iam
       stack_name: elasticdev:::aws_vpc-simple
       arguments:
         vpc_name: demo-ed-vpc-simple
         eks_cluster: demo-ed-eks
         publish_to_saas: true
       labels:
         - general
         - vpc
       credentials:
         - reference: demo-ed-iam
           orchestration: true
