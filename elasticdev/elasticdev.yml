global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: aws
     product: iam
infrastructure:
   iam-role:
       stack_name: elasticdev:::aws_iam_role
       arguments:
          role_name: eval-ed-role
          instance_profile_name: eval-ed-role
          iam_role_policy_name: eval-ed-role
       labels:
          - general
          - infrastructure
       credentials:
           - reference: aws
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
