labels:
   general: 
     environment: dev
     purpose: ci
infrastructure:
   lambda:
       stack_name: elasticdev:::aws_lambda
       arguments:
          aws_default_region: eu-west-1
          s3_bucket: flask-sample-private-codebuild-ci
          s3_bucket: lambda-bucket
          s3_key:    test-lambda.zip
          lambda_name: test-lambda
          lambda_layers: arn:aws:lambda:eu-west-1:553035198032:layer:git-lambda2:8
          lambda_env_vars_hash:
            ENV: dev
          cloud_tags_hash:
            billing_reference: flask-sample
            environmental: dev
            phase: ci
       to_base64:
         - cloud_tags_hash
         - lambda_env_vars_hash
       credentials:
         - reference: eval-ed-iam
           orchestration: true
       inputvars:
         - reference: github-token
           orchestration: true
       labels:
          - general
