labels:
   general: 
     environment: dev
     purpose: ci
global_arguments:
   aws_default_region: eu-west-1
   ci_environment: ed-eval
   suffix_id: d645633
   cloud_tags_hash:
       environment: dev
       purpose: ci
       billing_code: 87deo
infrastructure:
   ecr_repo:
       stack_name: elasticdev:::ecr_repo
       arguments:
          name: maven_sample
          docker_repo: maven_sample
       credentials:
           - reference: eval-ed-iam
             orchestration: true
custom:
   codebuild:
       stack_name: elasticdev:::add_codebuild_ci
       dependencies: 
           - infrastructure::ecr_repo
       arguments:
          codebuild_name: maven-sample-private
          git_repo: maven_sample-private
          git_url: git@github.com:williaumwu/maven_sample-private.git
          branch: ci
          ecr_repo_name: maven_sample
          docker_username: williaumwu
          docker_registry: ecr
          slack_channel: testing
       to_base64:
         - cloud_tags_hash
       credentials:
         - reference: eval-ed-iam
           orchestration: true
       inputvars:
         - reference: dockerhub-token
           orchestration: true
         - reference: slack-webhook
           orchestration: true
         - reference: github-token
           orchestration: true
       labels:
          - general
