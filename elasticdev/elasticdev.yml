global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: eval
     purpose: test
   infrastructure:
     cloud: aws
     product: vpc
     app_tier: networking
infrastructure:
   vpc:
       stack_name: elasticdev:::aws_vpc-simple
       arguments:
         vpc_name: eval-ed-vpc-simple
         eks_cluster: eval-ed-eks
         publish_to_saas: true
       labels:
         - general
         - infrastructure
       credentials:
         - reference: eval-ed-iam
           orchestration: true
