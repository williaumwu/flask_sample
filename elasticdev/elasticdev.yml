labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: do
selectors:
   ssh_key_info:
     match_labels:
       cloud: do
       environment: dev
     match_keys:
       provider: do
     match_params:
       must_exists: True
       resource_type: ssh_key
infrastructure:
   ssh_upload:
       stack_name: elasticdev:::new_do_ssh_key
       arguments:
          name: ed-test-do-key
       labels:
         - general
         - infrastructure
       credentials:
           - reference: do
             orchestration: true
   droplet:
       stack_name: elasticdev:::droplet
       dependencies:
          - infrastructure::ssh_upload
       selectors:
         - ssh_key_info
       arguments:
          ssh_key_id: selector:::ssh_key_info::id
          hostname: example-droplet
          region: NYC1
          size: s-1vcpu-1gb
          with_monitoring: True
          with_backups: false
          with_ipv6: false
          with_private_networking: false
          with_resize_disk: false
       credentials:
           - reference: do
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
