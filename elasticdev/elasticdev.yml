global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: aws
     product: iam
infrastructure:
   iam:
       stack_name: elasticdev:::aws_iam
       arguments:
          iam_name: eval-ed-iam
          policy_name: eval-ed-iam
          allows_hash: 
             - resources: 
                 - "*"
               actions: 
                 - codebuild:*
                 - codepipeline:*
                 - lambda:*
                 - ecr:*
                 - s3:*
                 - ec2:*
                 - ssm:*
                 - eks:*
                 - rds:*
                 - dynamodb:*
                 - execute-api:/*/*/*
                 - execute-api:*
                 - kms:*
                 - iam:*
                 - events:*
                 - elasticfilesystem:*
                 - kafka:*
                 - appmesh:*
                 - cloudtrail:*
                 - efs:*
                 - devicefarm:*
                 - cloudformation:*
                 - glacier:*
                 - kinesis:*
                 - logs:*
                 - servicediscovery:*
                 - sns:*
                 - acm:*
                 - sqs:*
                 - cloudfront:*
                 - cloudwatch:*
                 - docdb:*
                 - ecs:*
                 - route53:*
                 - stepfunctions:*
                 - apigatewayv2:*
                 - apigatewaymanagementapi:*
                 - discovery:*
       to_base64:
         - allows_hash
       labels:
          - general
          - infrastructure
       credentials:
           - reference: aws
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
