global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: eval
     purpose: test
   infrastructure:
     cloud: aws
     product: k8
selectors:
   vpc_info:
     match_labels:
       environment: eval
       purpose: test
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
     match_params:
       must_exists: True
       resource_type: vpc
   sg_bastion_info:
     match_labels:
       environment: eval
       purpose: test
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
       name: bastion
     match_params:
       must_be_one: True
       resource_type: security_group
   subnet_info:
     match_labels:
       environment: eval
       purpose: test
       app_tier: networking
     match_keys:
       provider: aws
       region: eu-west-1
       name: public
     match_params:
       resource_type: subnet
infrastructure:
   eks:
       stack_name: elasticdev:::aws_eks
       arguments:
          role_name: eval-ed-role
          vpc_name: selector:::vpc_info::name
          vpc_id: selector:::vpc_info::vpc_id
          eks_cluster: eval-ed-eks
          eks_cluster_version: 1.19
          subnet_ids: selector:::subnet_info::subnet_id:csv
          sg_id: selector:::sg_bastion_info::sg_id
          eks_min_capacity: 1
          eks_max_capacity: 1
          eks_desired_capacity: 1
          publish_to_saas: true
       labels:
          - general
          - infrastructure
       selectors:
         - vpc_info
         - subnet_info
         - sg_bastion_info
       credentials:
           - reference: eval-ed-iam
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
