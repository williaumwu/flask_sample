global:
   selectors: 
     aws_base:
       match_keys:
         provider: aws
       match_labels:
         environment: dev
         purpose: eval-ed
labels:
   general: 
     environment: dev
     purpose: eval-ed
   infrastructure:
     cloud: aws
     product: eks
selectors:
   network_vars:
     labels:
       environment: dev
       purpose: eval-ed
       area: network
       region: eu-west-1
       cloud: aws
infrastructure:
   eks:
       stack_name: elasticdev:::aws_eks
       arguments:
          vpc_name: selector:::network_vars::vpc_name
          vpc_id: selector:::network_vars::vpc_id
          subnet_ids: selector:::network_vars::private_subnet_ids:csv
          sg_id: selector:::network_vars::bastion_sg_id
          eks_cluster: eval-ed-eks
          eks_cluster_version: 1.23
          eks_min_capacity: 1
          eks_max_capacity: 1
          eks_desired_capacity: 1
          publish_to_saas: true
       labels:
          - general
          - infrastructure
       selectors:
         - vpc_info
         - subnet_info
         - sg_bastion_info
       credentials:
           - reference: eval-ed-iam
             orchestration: true
destroy:
   stack_name: elasticdev:::ed_core::callback_delete
