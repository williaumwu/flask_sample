global_arguments:
   aws_default_region: eu-west-1
labels:
   general: 
     environment: dev
     purpose: test
   infrastructure:
     cloud: aws
     product: ssh_public_key
infrastructure:
   ssh_public_key:
       stack_name: elasticdev:::aws_ssh_public_key
       arguments:
          key_name: eval-ed-admin-ssh-key
       labels:
          - general
          - infrastructure
       credentials:
           - reference: eval-ed-iam
             orchestration: true
       inputvars:
           - reference: test_public_ssh_key
             orchestration: true
