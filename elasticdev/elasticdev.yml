labels:
   general: 
     environment: dev
     purpose: ci
global_arguments:
   aws_default_region: eu-west-1
   ci_environment: ed-eval
   suffix_id: d645633
   cloud_tags_hash:
       environment: dev
       purpose: ci
       billing_code: 87deo
custom:
   codebuild:
       create_webhook: false
       create_deploy_key: false
       stack_name: elasticdev:::codebuild_ci
       arguments:
          codebuild_name: flask-sample-private
          git_repo: flask_sample-private
          git_url: git@github.com:williaumwu/flask_sample-private.git
          branch: ci
          ecr_repo_name: flask_sample
          docker_registry: ecr
       to_base64:
         - cloud_tags_hash
       credentials:
         - reference: eval-ed-iam
           orchestration: true
       inputvars:
         - reference: dockerhub-token
           orchestration: true
         - reference: slack-webhook
           orchestration: true
         - reference: github-token
           orchestration: true
       labels:
          - general
