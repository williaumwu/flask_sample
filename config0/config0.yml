global:
   platform: config0-publish:::platform-do
   arguments: 
     do_region: lon1
   metadata:   
     labels:
        general: 
          environment: dev
          purpose: testing
          provider: doks
        doks: 
          platform: kubernetes
          component: manged_k8
infrastructure:
   jenkins:
     platform:
       stack_ref: jenkins_on_do 
     arguments:
        name: eval-jenkins
        region: NYC1
        size: s-1vcpu-2gb
        with_monitoring: true
        with_backups: false
        with_ipv6: false
        with_private_networking: false
        with_resize_disk: false
     metadata:
        labels:
          - general
        matchSelectors:
          - ssh_key_info
        credentials:
          - reference: do-token
            orchestration: true
   drift:
     dependencies:
       - infrastructure::doks
       - infrastructure::jenkins
     platform:
       stack_ref: check_drift_resources
     metadata:
        labels:
          - general
