global:
  arguments:
    aws_default_region: eu-west-1

labels:
  general:
    environment: dev
    purpose: eval-config0
  infrastructure:
    cloud: aws
    product: natgw
    area: networking

selectors:
  network_vars:
    match:
      labels:
        environment: dev
        purpose: eval-config0
        area: network
        region: eu-west-1
        cloud: aws

stacks:
  natgw:
    stack: config0-publish:::aws_nat_vpc
    arguments:
      public_subnet_ids: selector:::network_vars::public_subnet_ids
      nat_gateway_name: eval-config0-natgw
      private_route_table_id: selector:::network_vars::private_route_table_id
      cloud_tags_hash:
        environment: dev
        purpose: eval-config0
    selectors:
      - network_vars
    connections:
      - reference: dev1
