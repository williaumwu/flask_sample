labels:
  general:
    environment: dev
    purpose: test
  infrastructure:
    cloud: do

selectors:
  ssh_key_info:
    match:
      labels:
        cloud: do
        environment: dev
      keys:
        provider: do
      filter:
        resource_type: ssh_key
      expect:
        must_exist: true

stacks:
  ssh_upload:
    stack: elasticdev:::new_do_ssh_key
    arguments:
      name: config0-jenkins-example
    connections:
      - reference: do
        orchestration: true
  droplet:
    stack: elasticdev:::droplet
    dependencies:
      - ssh_upload
    selectors:
      - ssh_key_info
    arguments:
      ssh_key_id: selector:::ssh_key_info::id
      hostname: config0-jenkins-example
      region: NYC1
      size: s-1vcpu-2gb
      with_monitoring: true
      with_backups: false
      with_ipv6: false
      with_private_networking: false
      with_resize_disk: false
    connections:
      - reference: do
        orchestration: true
  jenkins_ans:
    stack: elasticdev:::jenkins_on_docker
    dependencies:
      - ssh_upload
      - droplet
    arguments:
      ssh_key_name: config0-jenkins-example
      hostname: config0-jenkins-example

destroy:
  stack: elasticdev:::ed_core::callback_delete
