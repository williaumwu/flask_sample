global:
   metadata:   
     labels:
        infrastructure:
          provider: aws
          product: ec2
     matchSelectors:
        network_vars:
          labels:
            environment: dev
            purpose: eval-config0
            area: network
            region: eu-west-1
infrastructure:
   aws_ec2:
     stack_name: config0-publish:::aws_ec2_server
     arguments:
        ssh_key_name: mongodb-cluster-dev-ssh-key
        aws_default_region: eu-west-1
        hostnam: test101
        sg_id: selector:::network_vars::bastion_sg_id
        subnet_ids: selector:::network_vars::public_subnet_ids
        ami_filter: Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-\*
        ami_owner: 099720109477 
        instance_type: t3.micro
        disksize: 25
     metadata:
       labels:
         - infrastructure
       selectors:
         - network_vars
