global:
   selectors: 
     aws:
       match_keys:
         provider: aws
   arguments: 
     aws_default_region: eu-west-1
     ci_environment: python
     suffix_id: f645633
     cloud_tags_hash:
       environment: dev
       purpose: ci
       billing_code: 87deo
       platform: gitlab
labels:
   general: 
     environment: dev
     purpose: ci
     provider: gitlab
   gitlab: 
     platform: gitlab
     component: runner
selectors:
   gitlab_group_info:
     match_params:
       must_exists: True
       resource_type: gitlab_group
     keys:
       provider: gitlab
     labels:
       environment: dev
       purpose: ci
   aws_gitlab_cred:
     labels:
       platform: gitlab
       component: runner
     keys:
       provider: aws
     parameters:
       must_exists: True
       resource_type: credentials
   vpc_info:
     match_ref: aws
     match_params:
       must_exists: True
       resource_type: vpc
   public_subnet_info:
     match_ref: aws
     match_keys:
       name: public
     match_params:
       resource_type: subnet
   sg_bastion_info:
     match_ref: aws
     match_keys:
       name: bastion
     match_params:
       must_be_one: True
       resource_type: security_group
infrastructure:
   setup_gitlab:
       stack_name: elasticdev:::setup_gitlab_fargate_runner
       arguments:
          parent_id: 57929601
          disksize: 20
          gitlab_runners_ami: ami-0f03fd8a6e34800c0
          visibility_level: private
          spot_price: 0.05
          gitlab_runners_token_hash: selector:::gitlab_group_info::runners_token
          gitlab_runner_aws_access_key: selector:::aws_gitlab_cred::AWS_ACCESS_KEY_ID
          gitlab_runner_aws_secret_key: selector:::aws_gitlab_cred::AWS_SECRET_ACCESS_KEY
          vpc_name: selector:::vpc_info::name
          subnet_ids: selector:::public_subnet_info::subnet_id:csv
          sg_id: selector:::sg_bastion_info::sg_id
          vpc_id: selector:::vpc_info::vpc_id
          bastion_sg_id: selector:::sg_bastion_info::sg_id
          docker_host: docker-temp-build-074
          docker_image_tag: latest
          docker_repo_name: gitlab
          disksize: 25
       to_base64:
         - cloud_tags_hash
       selectors:
         - vpc_info
         - public_subnet_info
         - sg_bastion_info
         - aws_gitlab_cred
         - gitlab_group_info
       credentials:
         - reference: eval-config0-iam
           orchestration: true
       inputvars:
           - reference: gitlab-parent-group
             orchestration: true
           - reference: gitlab-token
             orchestration: true
           - reference: aws_account_id
             orchestration: true
       labels:
           - general
           - gitlab
