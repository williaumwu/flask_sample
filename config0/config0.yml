global:
  platform: config0-publish:::platform-do
  metadata:   
    labels:
       general: 
         environment: dev
         purpose: test
       infrastructure:
         cloud: do
    matchSelectors:
       ssh_key_info:
         match_labels:
           cloud: do
           environment: dev
         match_keys:
           provider: do
         match_params:
           must_exists: True
           resource_type: ssh_public_key
infrastructure:
   jenkins:
       platform:
         stack_ref: jenkins_on_do 
       arguments:
          name: eval-jenkins
          region: NYC1
          size: s-1vcpu-2gb
          with_monitoring: true
          with_backups: false
          with_ipv6: false
          with_private_networking: false
          with_resize_disk: false
       metadata:
          labels:
            - general
            - infrastructure
          matchSelectors:
            - ssh_key_info
          credentials:
            - reference: do-token
              orchestration: true
   drift:
     dependencies:
       - infrastructure::jenkins
     platform:
       stack_ref: check_drift_resources
     metadata:
        labels:
          - general
