global:
  platform: config0-publish:::platform-eval-config0
infrastructure:
   setup_iac_ci:
     platform:
       stack_ref: setup_iac_ci
   register_repo_to_iac_ci:
     dependencies:
         - infrastructure::setup_iac_ci
     platform:
       stack_ref: register_repo_iac_ci
     arguments:
       aws_default_region: us-east-1
     metadata:
       inputvars:
         - reference: slack-webhook-hash
           orchestration: true
         - reference: github-token
           orchestration: true
         - reference: iac-ci-repo-info
           orchestration: true
