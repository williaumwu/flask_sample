global:
   platform: config0-publish:::platform-do
   arguments: 
     do_region: lon1
   metadata:   
     labels:
        general: 
          environment: dev
          purpose: testing
          provider: doks
        doks: 
          platform: kubernetes
          component: manged_k8
     matchSelectors:
        ssh_key_info:
          match_labels:
            cloud: do
            environment: dev
          match_keys:
            provider: do
          match_params:
            must_exists: True
            resource_type: ssh_public_key
infrastructure:
   doks:
     platform:
        stack_ref: doks 
     arguments:
        doks_cluster_name: eval-config0-doks
        doks_cluster_version: 1.29.1-do.0
        doks_cluster_pool_size: s-1vcpu-2gb-amd
        doks_cluster_autoscale_max: 4
        doks_cluster_autoscale_min: 1
     metadata:
        labels:
          - general
          - doks
        credentials:
          - reference: do-token
            orchestration: true
   jenkins:
     platform:
       stack_ref: jenkins_on_do 
     arguments:
        name: eval-jenkins
        region: NYC1
        size: s-1vcpu-2gb
        with_monitoring: true
        with_backups: false
        with_ipv6: false
        with_private_networking: false
        with_resize_disk: false
     metadata:
        labels:
          - general
        matchSelectors:
          - ssh_key_info
        credentials:
          - reference: do-token
            orchestration: true
   drift:
     dependencies:
       - infrastructure::doks
       - infrastructure::jenkins
     platform:
       stack_ref: check_drift_resources
     metadata:
        labels:
          - general
