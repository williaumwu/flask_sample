global:
  metadata:   
    labels:
       general: 
         environment: dev
         purpose: eval-config0
       infrastructure:
         cloud: aws
         product: iam
infrastructure:
   iam:
     stack_name: elasticdev:::aws_iam
     arguments:
        iam_name: eval-config0-iam
        policy_name: eval-config0-iam
        allows_hash: 
           - resources: 
               - "*"
             actions: 
               - rds:*
               - kafka:*
               - logs:*
               - cloudtrail:*
               - dynamodb:*
               - sqs:*
               - codebuild:*
               - appmesh:*
               - servicediscovery:*
               - cloudfront:*
               - kms:*
               - kinesis:*
               - xray:*
               - events:*
               - sns:*
               - elasticfilesystem:*
               - states:*
               - apigateway:*
               - s3:*
               - cloudformation:*
               - iam:*
               - devicefarm:*
               - glacier:*
               - cloudwatch:*
               - ssm:*
               - aws-portal:*
               - route53:*
               - lambda:*
               - ecs:*
               - ecr:*
               - codepipeline:*
               - ec2:*
               - eks:*
               - acm:*
     spec:
       serialization:
         to_base64:
           arguments:
             - allows_hash
     metadata:
       labels:
         - general
         - infrastructure
       credentials:
         - reference: aws
           orchestration: true
