labels:
  infrastructure:
    provider: aws
    product: ec2

selectors:
  network_vars:
    match:
      labels:
        environment: dev
        purpose: eval-config0
        area: network
        region: eu-west-1

stacks:
  aws_ec2:
    stack: williaumwu:::aws_ec2_server
    arguments:
      ssh_key_name: default
      aws_default_region: eu-west-1
      hostname: test101
      sg_id: selector:::network_vars::bastion_sg_id
      subnet_ids: selector:::network_vars::public_subnet_ids
      ami_filter: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
      ami_owner: 099720109477
      instance_type: t3.micro
      disksize: 25
    selectors:
      - network_vars
