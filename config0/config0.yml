global:
  arguments: 
    aws_default_region: eu-west-1
    ci_environment: config0-eval
    suffix_id: d645633
    cloud_tags_hash:
        environment: dev
        purpose: ci
        billing_code: 87deo
  metadata:   
    labels:
       general: 
         environment: dev
         purpose: ci
selectors:
   network_vars:
     labels:
       environment: dev
       purpose: eval-config0
       area: network
       region: eu-west-1
       cloud: aws
infrastructure:
   ecr_repo:
     stack_name: config0-publish:::ecr_repo
     arguments:
        name: flask_sample
        docker_repo: flask_sample
     metadata:
       credentials:
         - reference: eval-config0-iam
           orchestration: true
custom:
   codebuild:
     stack_name: config0-publish:::add_codebuild_ci
     arguments:
       codebuild_name: flask-sample-private
       git_repo: flask_sample-private
       git_url: git@github.com:williaumwu/flask_sample-private.git
       branch: ci
       ecr_repo_name: flask_sample
       docker_username: williaumwu
       docker_registry: ecr
       slack_channel: opentofu
       security_group_id: selector:::network_vars::bastion_sg_id
       subnet_ids: selector:::network_vars::private_subnet_ids
       vpc_id: selector:::network_vars::vpc_id
     spec:
       dependencies: 
         - infrastructure::ecr_repo
       serialization:
         to_base64:
           arguments:
             - cloud_tags_hash
     metadata:
       credentials:
         - reference: eval-config0-iam
           orchestration: true
       inputvars:
         - reference: docker-token
           orchestration: true
         - reference: slack-webhook-hash
           orchestration: true
         - reference: github-token
           orchestration: true
       labels:
          - general
